<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anson Lo Music Versus - Sweet Style</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #fb7185; /* 更甜美的粉紅色 */
            --primary-hover: #f43f5e;
            --bg-color: #fff1f2;
            --card-bg: #ffffff;
            --text-main: #4b5563;
            --text-muted: #9ca3af;
            --font-round: 'ZCOOL KuaiLe', cursive;
            --font-main: 'Noto Sans TC', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 480px; 
            padding: 35px 25px; 
            border-radius: 40px; /* 超大圓角 */
            box-shadow: 0 20px 40px -10px rgba(251, 113, 133, 0.2); 
        }
        
        h1 { 
            text-align: center; 
            font-size: 2.2rem; 
            color: var(--primary-color); 
            margin-bottom: 25px; 
            font-family: var(--font-round); /* 標題使用圓潤快樂體 */
            letter-spacing: 2px;
        }

        .view { display: none; }
        .view.active { display: block; animation: bounceIn 0.6s ease; }
        
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 按鈕設計 */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .category-btn { 
            padding: 25px 10px; 
            background: #fff5f5; 
            border: 3px solid #ffe4e6; 
            border-radius: 25px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-color);
        }
        .category-btn:hover { 
            border-color: var(--primary-color); 
            transform: translateY(-5px);
            background: white;
        }

        /* 比較卡片 */
        .choice-card { 
            padding: 30px 20px; 
            background: #fff5f5; 
            border: 3px solid #ffe4e6; 
            border-radius: 30px; 
            text-align: center; 
            cursor: pointer; 
            font-size: 1.3rem; 
            font-weight: 700; 
            min-height: 140px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.2s; 
            margin-bottom: 15px;
            color: #4b5563;
        }
        .choice-card:hover { 
            border-color: var(--primary-color); 
            background: var(--primary-color);
            color: white;
            transform: scale(1.05);
        }

        .progress-bar { width: 100%; height: 12px; background: #ffe4e6; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        #progress-fill { width: 0%; height: 100%; background: var(--primary-color); border-radius: 10px; transition: 0.4s; }

        /* 截圖區域 */
        #capture-area {
            background: radial-gradient(circle, #ffffff 0%, #fff1f2 100%);
            padding: 40px 20px;
            border-radius: 35px;
            text-align: center;
            border: 4px dashed #fb7185;
            margin-bottom: 25px;
        }
        .share-header { 
            color: #fb7185; 
            font-size: 1.8rem; 
            font-weight: bold; 
            margin-bottom: 25px; 
            font-family: var(--font-round);
        }
        .result-item { 
            display: flex; 
            align-items: center; 
            padding: 15px 20px; 
            background: white; 
            margin-bottom: 12px; 
            border-radius: 20px; 
            box-shadow: 0 4px 10px rgba(251, 113, 133, 0.1); 
        }
        .rank-num { 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: #fb7185; 
            margin-right: 20px; 
            font-family: var(--font-round);
        }
        .song-name { font-weight: 700; font-size: 1.1rem; color: #374151; text-align: left; flex: 1; }
        .share-footer { margin-top: 20px; font-size: 0.9rem; color: #fb7185; font-family: var(--font-round); opacity: 0.7; }

        /* 功能按鈕 */
        .btn { 
            width: 100%; 
            padding: 18px; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            font-weight: bold; 
            margin-bottom: 15px; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(251, 113, 133, 0.3);
        }
        .btn:hover { background: var(--primary-hover); transform: scale(1.02); }
        .btn-download { background: #34d399; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.3); }
        .btn-download:hover { background: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <h1>Anson Lo Versus</h1>

    <div id="menu-view" class="view active">
        <div class="category-grid">
            <div class="category-btn" onclick="preset('fast')">⚡ 快歌</div>
            <div class="category-btn" onclick="preset('slow')">🌙 慢歌</div>
        </div>
        <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted); font-weight: bold;">選出你的 Top 5 心水歌曲！</p>
    </div>

    <div id="compare-view" class="view">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p id="round-info" style="text-align: center; color: var(--primary-color); font-size: 1rem; font-weight: bold; margin-bottom: 15px; font-family: var(--font-round);"></p>
        <div id="option-a" class="choice-card" onclick="makeChoice(0)"></div>
        <div id="option-b" class="choice-card" onclick="makeChoice(1)"></div>
    </div>

    <div id="result-view" class="view">
        <div id="capture-area">
            <div class="share-header">My Top 5 Picks</div>
            <div id="top5-list"></div>
            <div class="share-footer">Anson Lo Music Versus ✨</div>
        </div>
        
        <button class="btn btn-download" onclick="downloadImage()">📸 儲存美照分享</button>
        <button class="btn" onclick="location.reload()">再玩一次 ↺</button>
    </div>
</div>

<script>
    const presets = {
        fast: ["一所懸命", "Megahit", "Megahit Megamix", "Mr. Stranger", "King Kong", "MONEY", "Nah", "ON", "Hey Hey OK!", "Heartbreaker", "Lemonade", "Gimme Gimme", "Charisma", "Trippin' Up", "Take That", "Rude Boy"],
        slow: ["Burn Out", "角落生物", "神隊友", "EGO", "不可愛教主", "永順街39號", "同居陌生人", "偷情", "浪漫殺死巨蟹座", "特別約會儀式", "致我", "你都有今日", "本命", "我的支持型伴侶"]
    };

    let items = [], scores = {}, leftIdx = 0, rightIdx = 1;

    function preset(type) {
        items = [...presets[type]].sort(() => Math.random() - 0.5);
        scores = {}; 
        items.forEach(i => scores[i] = 0);
        leftIdx = 0; rightIdx = 1;
        showView('compare-view');
        updateUI();
    }

    function makeChoice(idx) {
        const winner = idx === 0 ? items[leftIdx] : items[rightIdx];
        scores[winner]++;
        if (idx === 1) {
            let temp = items[leftIdx];
            items[leftIdx] = items[rightIdx];
            items[rightIdx] = temp;
        }
        rightIdx++;
        if (rightIdx < items.length) {
            updateUI();
        } else {
            showResults();
        }
    }

    function updateUI() {
        document.getElementById('option-a').textContent = items[leftIdx];
        document.getElementById('option-b').textContent = items[rightIdx];
        const progress = (rightIdx / items.length) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
        document.getElementById('round-info').textContent = `對決中：${rightIdx} / ${items.length}`;
    }

    function showResults() {
        showView('result-view');
        const sorted = [...items].sort((a, b) => scores[b] - scores[a]);
        const top5 = sorted.slice(0, 5);
        const listEl = document.getElementById('top5-list');
        listEl.innerHTML = top5.map((song, i) => `
            <div class="result-item">
                <div class="rank-num">${i + 1}</div>
                <div class="song-name">${song}</div>
            </div>
        `).join('');
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function downloadImage() {
        const btn = document.querySelector('.btn-download');
        const originalText = btn.textContent;
        btn.textContent = "生成中... ✨";
        btn.disabled = true;

        const area = document.getElementById('capture-area');
        html2canvas(area, {
            backgroundColor: "#fff1f2",
            scale: 2,
            borderRadius: 35,
            logging: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `AnsonLo-Top5-${new Date().getTime()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.textContent = originalText;
            btn.disabled = false;
        }).catch(() => {
            alert("哎呀，生成失敗了，請嘗試手動截圖喔！");
            btn.textContent = originalText;
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
