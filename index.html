<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anson Lo Versus - 神徒專屬版</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #FFC0CB; 
            --accent-color: #FF99AC;
            --bg-color: #FFF5F7;
            --card-bg: #ffffff;
            --text-main: #6B7280;
            --font-round: 'ZCOOL KuaiLe', cursive;
            --font-main: 'Noto Sans TC', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        .container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 480px; 
            padding: 30px 20px; 
            border-radius: 40px; 
            box-shadow: 0 15px 40px rgba(255, 192, 203, 0.4); 
            text-align: center;
        }
        
        h1 { font-size: 2.2rem; color: var(--accent-color); margin-bottom: 20px; font-family: var(--font-round); text-shadow: 2px 2px 0px #fff; }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .category-btn { 
            padding: 25px 10px; background: #fff9fa; border: 2px solid var(--primary-color); 
            border-radius: 25px; cursor: pointer; transition: 0.3s; 
            color: var(--accent-color); font-weight: bold; font-size: 1.2rem; font-family: var(--font-round);
        }
        .category-btn:hover { background: var(--primary-color); color: white; transform: translateY(-3px); }

        .choice-card { 
            background: #fff; border: 4px solid #fff1f3; border-radius: 35px; 
            cursor: pointer; transition: 0.3s; margin-bottom: 18px; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .choice-card:hover { border-color: var(--primary-color); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255, 192, 203, 0.3); }
        
        .song-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #fdf2f4; }
        .song-label { font-size: 1.3rem; font-weight: 700; padding: 20px 15px; color: var(--text-main); font-family: var(--font-main); }

        .progress-bar { width: 100%; height: 12px; background: #fff1f3; border-radius: 20px; margin-bottom: 20px; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); border-radius: 20px; transition: 0.4s; }

        #capture-area { background: #fff; padding: 35px 20px; border-radius: 35px; text-align: center; border: 4px solid var(--primary-color); }
        .share-header { color: var(--accent-color); font-size: 1.8rem; font-weight: bold; margin-bottom: 25px; font-family: var(--font-round); }
        
        .result-item { display: flex; align-items: center; padding: 12px; background: #fff9fa; margin-bottom: 12px; border-radius: 20px; border: 1px solid #fff1f3; }
        .rank-img { width: 65px; height: 65px; border-radius: 15px; object-fit: cover; margin-right: 15px; border: 2px solid var(--primary-color); }
        .rank-num { font-size: 1.6rem; font-weight: 900; color: var(--accent-color); margin-right: 15px; font-family: var(--font-round); width: 25px; }

        .btn { width: 100%; padding: 18px; background: var(--accent-color); color: white; border: none; border-radius: 25px; font-size: 1.15rem; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; box-shadow: 0 8px 20px rgba(255, 153, 172, 0.4); }
        .btn:hover { background: #ff7a94; transform: scale(1.02); }
        .btn-download { background: #6EE7B7; box-shadow: 0 8px 20px rgba(110, 231, 183, 0.4); }
        .btn-download:hover { background: #34D399; }
    </style>
</head>
<body>

<div class="container">
    <h1>Anson Lo Versus</h1>

    <div id="menu-view" class="view active">
        <div class="category-grid">
            <div class="category-btn" onclick="preset('fast')">⚡ 快歌</div>
            <div class="category-btn" onclick="preset('slow')">🌙 慢歌</div>
        </div>
        <p style="color: var(--accent-color); font-weight: bold; font-family: var(--font-round);">各位神徒，準備好選出心水了嗎？</p>
    </div>

    <div id="compare-view" class="view">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p id="round-info" style="color: var(--accent-color); font-weight: bold; margin-bottom: 15px; font-family: var(--font-round);"></p>
        <div class="choice-card" onclick="makeChoice(0)">
            <img id="img-a" class="song-img" src="" onerror="this.src='https://placehold.co/600x600/ffc0cb/ffffff?text=Loading...'">
            <div id="option-a" class="song-label"></div>
        </div>
        <div class="choice-card" onclick="makeChoice(1)">
            <img id="img-b" class="song-img" src="" onerror="this.src='https://placehold.co/600x600/ffc0cb/ffffff?text=Loading...'">
            <div id="option-b" class="song-label"></div>
        </div>
    </div>

    <div id="result-view" class="view">
        <div id="capture-area">
            <div class="share-header">神徒之選 Top 5</div>
            <div id="top5-list"></div>
            <p style="margin-top:15px; color: var(--primary-color); font-family: var(--font-round); font-size: 0.9rem;">ansonlohonting-intlfanclub.com</p>
        </div>
        <button class="btn btn-download" onclick="downloadImage()">📸 儲存結果分享</button>
        <button class="btn" onclick="location.reload()">再玩一次</button>
    </div>
</div>

<script>
    const songImages = {
        // 更新過的特定歌曲連結
        "本命": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/19e978e22b24a827cda3e1554222064e.jpg?v=1774409729",
        "我的支持型伴侶": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Rude Boy": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Take That": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Trippin' Up": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Lemonade": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "你都有今日": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/The_time_is_always_now_cover_pic.png?v=1748233393",

        // 其他單曲連結
        "一所懸命": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Burn_Out_626b96e4-4d1c-4394-b153-60580798e29a.jpg",
        "Megahit": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Megahit.jpg",
        "Megahit Megamix": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Megahit_Megamix.jpg",
        "Mr. Stranger": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Mr_Stranger.jpg",
        "King Kong": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/King_Kong.jpg",
        "MONEY": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/MONEY.jpg",
        "Nah": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Nah.jpg",
        "ON": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/ON.jpg",
        "Hey Hey OK!": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Hey_Hey_OK.jpg",
        "Heartbreaker": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Heartbreaker.jpg",
        "Gimme Gimme": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Gimme_Gimme.jpg",
        "Charisma": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Charisma.jpg?v=1774409406",
        "Burn Out": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Burn_Out.jpg",
        "角落生物": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Corner_Creature.jpg",
        "神隊友": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Teammate.jpg",
        "EGO": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/EGO.jpg",
        "不可愛教主": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Unlovable_Leader.jpg",
        "永順街39號": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/39_Wing_Shun_Street.jpg",
        "同居陌生人": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Stranger_Under_The_Same_Roof.jpg",
        "偷情": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Secret_Affair.jpg",
        "浪漫殺死巨蟹座": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Romance_Kills_Cancer.jpg",
        "特別約會儀式": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Special_Dating_Ritual.jpg",
        "致我": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/To_Me.jpg"
    };

    const presets = {
        fast: ["一所懸命", "Megahit", "Megahit Megamix", "Mr. Stranger", "King Kong", "MONEY", "Nah", "ON", "Hey Hey OK!", "Heartbreaker", "Lemonade", "Gimme Gimme", "Charisma", "Trippin' Up", "Take That", "Rude Boy"],
        slow: ["Burn Out", "角落生物", "神隊友", "EGO", "不可愛教主", "永順街39號", "同居陌生人", "偷情", "浪漫殺死巨蟹座", "特別約會儀式", "致我", "你都有今日", "本命", "我的支持型伴侶"]
    };

    let items = [], scores = {}, leftIdx = 0, rightIdx = 1;

    function preset(type) {
        items = [...presets[type]].sort(() => Math.random() - 0.5);
        scores = {}; items.forEach(i => scores[i] = 0);
        leftIdx = 0; rightIdx = 1;
        showView('compare-view');
        updateUI();
    }

    function makeChoice(idx) {
        const winner = idx === 0 ? items[leftIdx] : items[rightIdx];
        scores[winner]++;
        if (idx === 1) { [items[leftIdx], items[rightIdx]] = [items[rightIdx], items[leftIdx]]; }
        rightIdx++;
        if (rightIdx < items.length) { updateUI(); } else { showResults(); }
    }

    function updateUI() {
        const a = items[leftIdx], b = items[rightIdx];
        document.getElementById('option-a').textContent = a;
        document.getElementById('img-a').src = songImages[a] || "";
        document.getElementById('option-b').textContent = b;
        document.getElementById('img-b').src = songImages[b] || "";
        document.getElementById('progress-fill').style.width = (rightIdx / items.length * 100) + '%';
        document.getElementById('round-info').textContent = `神徒抉擇中 ${rightIdx} / ${items.length}`;
    }

    function showResults() {
        showView('result-view');
        const sorted = [...items].sort((a, b) => scores[b] - scores[a]);
        const top5 = sorted.slice(0, 5);
        document.getElementById('top5-list').innerHTML = top5.map((song, i) => `
            <div class="result-item">
                <div class="rank-num">${i + 1}</div>
                <img class="rank-img" src="${songImages[song]}" alt="${song}">
                <div style="font-weight:700; flex:1; text-align:left; color:#555;">${song}</div>
            </div>
        `).join('');
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function downloadImage() {
        const btn = document.querySelector('.btn-download');
        btn.textContent = "生成中...";
        html2canvas(document.getElementById('capture-area'), { 
            backgroundColor: "#ffffff",
            useCORS: true,
            scale: 2 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `AnsonLo_Top5_神徒.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.textContent = "📸 儲存結果分享";
        });
    }
</script>
</body>
</html>
