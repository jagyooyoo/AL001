<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anson Lo Versus - 神徒專屬版</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #FFC0CB;
            --accent-color: #FF99AC;
            --bg-overlay: rgba(255, 245, 247, 0.75); /* 背景透明度控制 */
            --card-bg: rgba(255, 255, 255, 0.92);   /* 主容器透明度 */
            --text-main: #4B5563;
            --font-round: 'ZCOOL KuaiLe', cursive;
            --font-main: 'Noto Sans TC', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;
            /* 背景圖片設定：使用你提供的塗鴉牆圖片 */
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)),
                              url('https://googleusercontent.com/image_generation_content/0');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* 主容器：加入毛玻璃模糊效果 */
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            height: 92vh;
            max-height: 800px;
            padding: 20px 15px;
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 { font-size: 1.6rem; color: #E11D48; margin-bottom: 10px; font-family: var(--font-round); text-shadow: 1px 1px 0px #fff; }

        .view { display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .view.active { display: flex; flex-direction: column; animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #menu-view { justify-content: center; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .category-btn {
            padding: 25px 10px;
            background: linear-gradient(135deg, #fff9fa 0%, #fff 100%);
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            cursor: pointer;
            color: #E11D48;
            font-weight: bold;
            font-size: 1.15rem;
            font-family: var(--font-round);
            box-shadow: 0 4px 10px rgba(255, 192, 203, 0.4);
            transition: 0.2s;
        }
        .category-btn:active { transform: scale(0.95); }

        .version-tag { position: absolute; bottom: 8px; right: 15px; font-size: 8px; color: #999; opacity: 0.5; }

        .back-btn {
            position: absolute; top: 20px; left: 15px; background: #fff;
            color: var(--accent-color); border: 2px solid #fff1f3; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 1.1rem; z-index: 10;
        }

        /* 修正點擊無反應：加強 :active 回饋與取消點擊延遲 */
        .choice-card {
            background: #fff; border: 3px solid #fff; border-radius: 24px;
            cursor: pointer; transition: transform 0.1s;
            margin-bottom: 12px; overflow: hidden;
            display: flex; flex-direction: column; flex: 1; min-height: 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .choice-card:active { transform: scale(0.97); opacity: 0.8; }

        .song-img { width: 100%; flex: 1; object-fit: cover; background: #000; min-height: 0; }
        .song-label { font-size: 1rem; font-weight: 700; padding: 12px 5px; color: var(--text-main); background: #fff; }

        .progress-container { margin-bottom: 12px; }
        .progress-bar { width: 100%; height: 8px; background: #f3f4f6; border-radius: 10px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #FF99AC, #FFC0CB); transition: 0.4s; }
        #round-info { font-size: 0.85rem; margin-bottom: 6px; color: #E11D48; font-family: var(--font-round); font-weight: bold; }

        #capture-area { padding: 15px; border-radius: 25px; border: 4px solid var(--primary-color); margin-bottom: 10px; background: white; }
        .share-header { color: #E11D48; font-size: 1.3rem; margin-bottom: 15px; font-family: var(--font-round); }
        .result-item { display: flex; align-items: center; padding: 8px 15px; background: #fff9fa; margin-bottom: 6px; border-radius: 15px; border: 1px solid #fff1f3; }
        .rank-img { width: 45px; height: 45px; border-radius: 10px; margin-right: 15px; object-fit: cover; }
        .rank-num { font-size: 1.2rem; font-weight: 900; color: #E11D48; width: 25px; font-family: var(--font-round); }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 18px; font-size: 1rem; cursor: pointer; font-weight: bold; color: white; }
        .btn-share { background: linear-gradient(135deg, #F472B6, #EC4899); }
        .btn-download { background: linear-gradient(135deg, #6EE7B7, #10B981); }
        .btn-reset { background: #9CA3AF; margin-top: 5px; }
        .source-link { font-size: 9px; color: #FFB6C1; margin-top: 10px; font-style: italic; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <button id="global-back" class="back-btn" onclick="confirmReset()" style="display: none;">↩</button>
    <h1>Anson Lo Versus</h1>

    <div id="menu-view" class="view active">
        <div class="category-grid">
            <div class="category-btn" onclick="initGame('fast')">⚡ 跳唱歌</div>
            <div class="category-btn" onclick="initGame('slow')">🌙 深情歌</div>
        </div>
        <p style="color: #E11D48; font-size: 0.95rem; font-family: var(--font-round);">神徒們，準備好選擇心水了嗎</p>
        <div class="version-tag">v1.2.2-stable-github</div>
    </div>

    <div id="compare-view" class="view">
        <div class="progress-container">
            <p id="round-info"></p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div class="choice-card" onclick="handleChoice(0)">
            <img id="img-a" class="song-img" src="" onerror="this.src='https://via.placeholder.com/300x300?text=AL'">
            <div id="option-a" class="song-label">載入中...</div>
        </div>
        <div class="choice-card" onclick="handleChoice(1)">
            <img id="img-b" class="song-img" src="" onerror="this.src='https://via.placeholder.com/300x300?text=AL'">
            <div id="option-b" class="song-label">載入中...</div>
        </div>
    </div>

    <div id="result-view" class="view">
        <div id="capture-area">
            <div class="share-header">神徒之選 Top 5</div>
            <div id="top5-list"></div>
            <p id="qr-replacement" class="source-link"></p>
        </div>
        <div class="btn-group">
            <button class="btn btn-share" onclick="shareToSocial()">📢 分享結果</button>
            <button class="btn btn-download" onclick="downloadImage()">💾 儲存圖片</button>
            <button class="btn btn-reset" onclick="location.reload()">再玩一次</button>
        </div>
    </div>
</div>

<script>
    // --- 圖片數據庫 ---
    const songImages = {
        "特別約會儀式": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/1125.jpg?v=1701010621",
        "偷情": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A14__1.jpg?v=1695549124",
        "同居陌生人": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A13__1.jpg?v=1695549262",
        "Mr. Stranger": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-1-1_1.jpg?v=1695549880",
        "Megahit Megamix": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-1-2_1.jpg?v=1695550314",
        "Megahit": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500_1.jpg?v=1695550442",
        "不可愛教主": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-2_1.jpg?v=1695550631",
        "EGO": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/IMG_0439_1.jpg?v=1695550874",
        "神隊友": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/IMG_9822_1.jpg?v=1695551039",
        "角落生物": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-3-1_1.jpg?v=1695551148",
        "Burn Out": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-2-4_1.jpg?v=1695551272",
        "一所懸命": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-7_1.jpg?v=1695551374",
        "深閨": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/AL_TheHomebodies.jpg?v=1713337402",
        "My Life": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/MyLife.jpg?v=1704852791",
        "Hey Hey OK!": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/HeyHeyOK_5b657f7c-2ff3-4376-80ed-452ad2803d75.jpg?v=1721128550",
        "Heartbreaker": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/gempages_477370228297172218-0414c180-4fbb-4212-9807-45d6710807eb.png?v=1741015997",
        "致我": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/al_tome.jpg?v=1729668242",
        "King Kong": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A11_King-Kong-2_1.jpg?v=1695550208",
        "永順街39號": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A12__39_1.jpg?v=1695549683",
        "MONEY": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A15_MONEY_1.jpg?v=1695548475",
        "Nah": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A15_1.jpg?v=1695548268",
        "浪漫殺死巨蟹座": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/cover_3000x3000-scaled_4b1a205b-4080-4aed-b631-3a05f2970d94.jpg?v=1694526945",
        "Lemonade": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/gempages_477370228297172218-74a952b7-5bd2-4609-9c56-079afa1cca63.png?v=1754586438",
        "本命": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/19e978e22b24a827cda3e1554222064e.jpg?v=1774409729",
        "我的支持型伴侶": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Rude Boy": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Take That": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Trippin' Up": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "你都有今日": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/The_time_is_always_now_cover_pic.png?v=1748233393",
        "Gimme Gimme": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Gimme_Gimme.jpg",
        "Charisma": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Charisma.jpg?v=1774409406",
        "ON": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/ON.jpg"
    };

    const presets = {
        fast: ["一所懸命", "Megahit", "Megahit Megamix", "Mr. Stranger", "King Kong", "MONEY", "Nah", "ON", "Hey Hey OK!", "Heartbreaker", "Lemonade", "Gimme Gimme", "Charisma", "Trippin' Up", "Take That", "Rude Boy", "My Life", "EGO"],
        slow: ["Burn Out", "角落生物", "神隊友", "不可愛教主", "永順街39號", "同居陌生人", "偷情", "浪漫殺死巨蟹座", "特別約會儀式", "致我", "你都有今日", "本命", "我的支持型伴侶", "深閨"]
    };

    let items = [], scores = {}, currentRound = 0, matchHistory = new Set();
    const MAX_ROUNDS = 25;
    let currentA = "", currentB = "";

    function initGame(type) {
        items = [...presets[type]].sort(() => Math.random() - 0.5);
        scores = {}; items.forEach(item => scores[item] = 1000);
        matchHistory.clear(); currentRound = 0;
        document.getElementById('global-back').style.display = 'flex';
        showView('compare-view');
        nextMatch();
    }

    function confirmReset() {
        if (confirm("要放棄目前的對決並返回嗎？")) location.reload();
    }

    function nextMatch() {
        currentRound++;
        if (currentRound > MAX_ROUNDS) {
            document.getElementById('global-back').style.display = 'none';
            showResults(); return;
        }

        const sorted = [...items].sort((a, b) => scores[b] - scores[a]);
        let found = false;
        let attempts = 0;

        while (!found && attempts < 100) {
            attempts++;
            let tA, tB;
            if (currentRound <= 10) {
                let idxA = Math.floor(Math.random() * items.length);
                let idxB = (idxA + Math.floor(Math.random() * 5) + 2) % items.length;
                tA = items[idxA]; tB = items[idxB];
            } else {
                let pivot = Math.random() > 0.3 ? Math.floor(Math.random() * 7) : Math.floor(Math.random() * (items.length - 1));
                tA = sorted[pivot]; tB = sorted[pivot + 1];
            }
            const key = [tA, tB].sort().join('|');
            if (tA !== tB && !matchHistory.has(key)) {
                currentA = tA; currentB = tB;
                matchHistory.add(key); found = true;
            }
        }
        if (!found) { currentA = items[0]; currentB = items[1]; }
        updateUI();
    }

    function handleChoice(idx) {
        const winner = idx === 0 ? currentA : currentB;
        const loser = idx === 0 ? currentB : currentA;
        const winProb = 1 / (1 + Math.pow(10, (scores[loser] - scores[winner]) / 400));
        const K = currentRound > 15 ? 60 : 40;
        const scoreChange = Math.round(K * (1 - winProb));
        scores[winner] += scoreChange;
        scores[loser] -= Math.floor(scoreChange * 0.8);
        nextMatch();
    }

    function updateUI() {
        const imgA = document.getElementById('img-a');
        const imgB = document.getElementById('img-b');
        document.getElementById('option-a').textContent = currentA;
        document.getElementById('option-b').textContent = currentB;
        
        // 確保圖片在更換時有重載動作
        imgA.src = ""; imgB.src = "";
        setTimeout(() => {
            imgA.src = songImages[currentA];
            imgB.src = songImages[currentB];
        }, 10);

        document.getElementById('progress-fill').style.width = (currentRound / MAX_ROUNDS * 100) + '%';
        document.getElementById('round-info').textContent = `神徒心水決戰：第 ${currentRound} / ${MAX_ROUNDS} 輪`;
    }

    function showResults() {
        showView('result-view');
        const sorted = [...items].sort((a, b) => scores[b] - scores[a]);
        const top5 = sorted.slice(0, 5);
        document.getElementById('top5-list').innerHTML = top5.map((song, i) => `
            <div class="result-item">
                <div class="rank-num">${i + 1}</div>
                <img class="rank-img" src="${songImages[song]}" alt="${song}">
                <div style="font-weight:700; flex:1; text-align:left; color:#E11D48; font-size:0.85rem;">${song}</div>
            </div>
        `).join('');
        document.getElementById('qr-replacement').textContent = `玩緊嘅係：${window.location.origin + window.location.pathname}`;
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function shareToSocial() {
        const btn = document.querySelector('.btn-share');
        btn.textContent = "準備中...";
        try {
            const canvas = await html2canvas(document.getElementById('capture-area'), { backgroundColor: "#ffffff", useCORS: true, scale: 2 });
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            const file = new File([blob], 'AL_Top5.png', { type: 'image/png' });
            const shareData = {
                title: 'Anson Lo Versus',
                text: `這是我選出的 Anson Lo 心水 Top 5！你也來挑戰看看吧！\n${window.location.href}`,
                files: [file]
            };
            if (navigator.share && navigator.canShare(shareData)) {
                await navigator.share(shareData);
            } else {
                alert("網址已複製，請自行下載圖片分享。");
                navigator.clipboard.writeText(`我的 Anson Lo 心水 Top 5：\n${window.location.href}`);
                downloadImage();
            }
        } catch (err) { console.error(err); } finally { btn.textContent = "📢 分享結果"; }
    }

    function downloadImage() {
        const btn = document.querySelector('.btn-download');
        btn.textContent = "儲存中...";
        html2canvas(document.getElementById('capture-area'), { backgroundColor: "#ffffff", useCORS: true, scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `AnsonLo_Top5.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.textContent = "💾 儲存圖片";
        });
    }
</script>
</body>
</html>
