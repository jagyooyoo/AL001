<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anson Lo Versus - 神徒專屬版</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #FFC0CB; 
            --accent-color: #FF99AC;
            --bg-color: #FFF5F7;
            --card-bg: #ffffff;
            --text-main: #6B7280;
            --font-round: 'ZCOOL KuaiLe', cursive;
            --font-main: 'Noto Sans TC', sans-serif;
        }

        /* 基礎佈局適配 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        html, body { height: 100%; width: 100%; background-color: var(--bg-color); overflow: hidden; }
        body { 
            display: flex; justify-content: center; align-items: center; 
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;
        }
        
        .container { 
            background: var(--card-bg); width: 100%; max-width: 400px; 
            height: 92vh; max-height: 800px;
            padding: 20px 15px; border-radius: 30px; 
            box-shadow: 0 10px 30px rgba(255,192,203,0.3); 
            text-align: center; display: flex; flex-direction: column; position: relative;
        }
        
        h1 { font-size: 1.5rem; color: var(--accent-color); margin-bottom: 10px; font-family: var(--font-round); }

        .view { display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .view.active { display: flex; flex-direction: column; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 首頁特定樣式 */
        #menu-view { justify-content: center; position: relative; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .category-btn { 
            padding: 20px 10px; background: #fff9fa; border: 2px solid var(--primary-color); 
            border-radius: 20px; cursor: pointer; color: var(--accent-color); 
            font-weight: bold; font-size: 1.1rem; font-family: var(--font-round);
        }
        .version-tag { 
            position: absolute; bottom: -5px; right: 5px; 
            font-size: 8px; color: #eee; font-family: sans-serif; pointer-events: none;
        }

        /* 返回按鈕 */
        .back-btn {
            position: absolute; top: 18px; left: 15px; background: #fff1f3;
            color: var(--accent-color); border: none; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 1rem; z-index: 10;
        }

        /* 對決卡片適配 */
        .choice-card { 
            background: #fdf2f4; border: 3px solid #fff1f3; border-radius: 20px; 
            cursor: pointer; transition: 0.2s; margin-bottom: 10px; overflow: hidden;
            display: flex; flex-direction: column; flex: 1; min-height: 0;
        }
        .song-img { width: 100%; flex: 1; object-fit: cover; background: #000; min-height: 0; }
        .song-label { font-size: 0.95rem; font-weight: 700; padding: 10px 5px; color: var(--text-main); background: #fff; }

        .progress-container { margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 6px; background: #fff1f3; border-radius: 10px; }
        #progress-fill { width: 0%; height: 100%; background: var(--accent-color); border-radius: 10px; transition: 0.3s; }
        #round-info { font-size: 0.8rem; margin-bottom: 5px; color: var(--accent-color); font-family: var(--font-round); }

        /* 結果頁 */
        #capture-area { padding: 12px; border-radius: 20px; border: 3px solid var(--primary-color); margin-bottom: 10px; background: white; }
        .share-header { color: var(--accent-color); font-size: 1.2rem; margin-bottom: 12px; font-family: var(--font-round); }
        .result-item { display: flex; align-items: center; padding: 6px 12px; background: #fff9fa; margin-bottom: 5px; border-radius: 12px; }
        .rank-img { width: 40px; height: 40px; border-radius: 8px; margin-right: 12px; object-fit: cover; }
        .rank-num { font-size: 1.1rem; font-weight: 900; color: var(--accent-color); width: 20px; font-family: var(--font-round); }

        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 15px; font-size: 0.95rem; cursor: pointer; font-weight: bold; color: white; }
        .btn-share { background: #F472B6; } 
        .btn-download { background: #6EE7B7; }
        .btn-reset { background: #9CA3AF; }
        .source-link { font-size: 9px; color: #FFB6C1; margin-top: 8px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <button id="global-back" class="back-btn" onclick="confirmReset()" style="display: none;">↩</button>
    <h1>Anson Lo Versus</h1>

    <div id="menu-view" class="view active">
        <div class="category-grid">
            <div class="category-btn" onclick="initGame('fast')">⚡ 跳唱歌</div>
            <div class="category-btn" onclick="initGame('slow')">🌙 深情歌</div>
        </div>
        <p style="color: var(--accent-color); font-size: 0.9rem; font-family: var(--font-round);">神徒們，準備好選擇心水了嗎</p>
        <div class="version-tag">v1.2.0</div>
    </div>

    <div id="compare-view" class="view">
        <div class="progress-container">
            <p id="round-info"></p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div class="choice-card" onclick="submitChoice(0)">
            <img id="img-a" class="song-img" src="">
            <div id="option-a" class="song-label"></div>
        </div>
        <div class="choice-card" onclick="submitChoice(1)">
            <img id="img-b" class="song-img" src="">
            <div id="option-b" class="song-label"></div>
        </div>
    </div>

    <div id="result-view" class="view">
        <div id="capture-area">
            <div class="share-header">神徒之選 Top 5</div>
            <div id="top5
