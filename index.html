<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anson Lo Versus - 神徒專屬版</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #FFC0CB; 
            --accent-color: #FF99AC;
            --bg-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 245, 247, 0.75) 100%); 
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-main: #4B5563;
            --font-round: 'ZCOOL KuaiLe', cursive;
            --font-main: 'Noto Sans TC', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        
        body { 
            display: flex; justify-content: center; align-items: center; 
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            background: var(--bg-overlay), 
                        url('https://raw.githubusercontent.com/jagyooyoo/AL001/refs/heads/main/1777784659143.png');
            background-size: 115% auto; 
            background-repeat: repeat; 
            background-position: center;
            background-attachment: fixed;
        }
        
        .container { 
            background: var(--card-bg); 
            width: 90%; 
            max-width: 380px; 
            height: auto; 
            max-height: 85vh; 
            padding: 25px 18px; 
            border-radius: 35px; 
            box-shadow: 0 15px 45px rgba(0,0,0,0.1); 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        h1 { font-size: 1.6rem; color: var(--accent-color); margin-bottom: 18px; font-family: var(--font-round); }

        .back-btn {
            position: absolute; top: 22px; left: 20px; 
            background: rgba(255, 255, 255, 0.9);
            color: var(--accent-color); border: none; 
            width: 36px; height: 36px;
            border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center;
            justify-content: center; font-size: 1.2rem; z-index: 10;
            box-shadow: 0 4px 10px rgba(255, 192, 203, 0.3);
        }

        .view { display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .view.active { display: flex; flex-direction: column; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        #menu-view { justify-content: center; gap: 20px; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 10px 0; }
        
        .category-btn { 
            padding: 20px 10px;
            background: #fff;
            border: 2px solid var(--primary-color); 
            border-radius: 24px; 
            cursor: pointer; 
            color: var(--accent-color); 
            font-weight: bold; 
            font-size: 1.1rem; 
            font-family: var(--font-round);
        }
        
        .version-tag { position: absolute; bottom: 12px; right: 20px; font-size: 9px; color: #ccc; }

        .choice-card { 
            background: #fff; border: 2px solid #fff; border-radius: 22px; 
            cursor: pointer; margin-bottom: 15px; overflow: hidden;
            display: flex; flex-direction: column; flex: 1.2;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .song-img { width: 100%; flex: 1; object-fit: cover; background: #fdfdfd; min-height: 0; }
        .song-label { font-size: 1rem; font-weight: 700; padding: 12px 5px; color: #555; background: #fff; }

        .progress-bar { width: 100%; height: 8px; background: #f0f0f0; border-radius: 10px; margin-bottom: 20px; }
        #progress-fill { width: 0%; height: 100%; background: var(--accent-color); border-radius: 10px; transition: width 0.4s ease; }
        #round-info { font-size: 0.9rem; color: var(--accent-color); margin-bottom: 8px; font-family: var(--font-round); }

        #capture-area { padding: 18px 12px; border-radius: 25px; border: 2px solid var(--primary-color); margin-bottom: 20px; background: white; }
        .share-header { color: var(--accent-color); font-size: 1.4rem; margin-bottom: 15px; font-family: var(--font-round); }
        .result-item { display: flex; align-items: center; padding: 8px 12px; background: #fffcfd; margin-bottom: 8px; border-radius: 16px; border: 1px solid #fff0f3; }
        .rank-img { width: 42px; height: 42px; border-radius: 10px; margin-right: 12px; object-fit: cover; }
        .rank-num { font-size: 1.3rem; font-weight: 900; color: var(--accent-color); width: 22px; text-align: center; }

        /* 【修正 2】底部按鈕新設計：精簡並排 */
        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 8px; 
            margin-top: auto;
        }
        .btn { 
            padding: 12px 5px; 
            border-radius: 15px; 
            font-size: 0.85rem; 
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 4px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
        .btn-icon { font-size: 1.2rem; }
        .btn-share { background: #F472B6; } 
        .btn-download { background: #6EE7B7; }
        .btn-reset { background: #E5E7EB; color: #6B7280; }
    </style>
</head>
<body>

<div class="container">
    <button id="global-back" class="back-btn" onclick="confirmReset()" style="display: none;">🏠</button>
    <h1>Anson Lo Versus</h1>

    <div id="menu-view" class="view active">
        <div class="category-grid">
            <div class="category-btn" onclick="initGame('fast')">⚡ 跳唱歌</div>
            <div class="category-btn" onclick="initGame('slow')">🌙 深情歌</div>
        </div>
        <p style="color: var(--accent-color); font-size: 0.95rem; font-family: var(--font-round); opacity: 0.9;">神徒們，準備好選出心水了嗎？</p>
        <div class="version-tag">v1.6.0-ui-optimized</div>
    </div>

    <div id="compare-view" class="view">
        <div class="progress-container">
            <p id="round-info"></p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div class="choice-card" onclick="handleChoice(0)">
            <img id="img-a" class="song-img" src="">
            <div id="option-a" class="song-label"></div>
        </div>
        <div class="choice-card" onclick="handleChoice(1)">
            <img id="img-b" class="song-img" src="">
            <div id="option-b" class="song-label"></div>
        </div>
    </div>

    <div id="result-view" class="view">
        <div id="capture-area">
            <div class="share-header">✨ 神徒之選 Top 5 ✨</div>
            <div id="top5-list"></div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-share" onclick="shareToSocial()">
                <span class="btn-icon">📢</span>分享
            </button>
            <button id="dl-btn" class="btn btn-download" onclick="downloadImage()">
                <span class="btn-icon">💾</span>儲存
            </button>
            <button class="btn btn-reset" onclick="location.reload()">
                <span class="btn-icon">🔄</span>再玩
            </button>
        </div>
    </div>
</div>
