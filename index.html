<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anson Lo Versus - 背景清晰版</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #FFC0CB; 
            --accent-color: #FF99AC;
            /* 【修正重點】降低遮罩透明度（數值變小），讓背景圖提升 10% 的清晰度 */
            --bg-overlay: linear-gradient(135deg, rgba(255, 245, 247, 0.3) 0%, rgba(255, 192, 203, 0.2) 100%); 
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #4B5563;
            --font-round: 'ZCOOL KuaiLe', cursive;
            --font-main: 'Noto Sans TC', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        
        body { 
            display: flex; justify-content: center; align-items: center; 
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            background: var(--bg-overlay), 
                        url('https://raw.githubusercontent.com/jagyooyoo/AL001/refs/heads/main/1777784659143.png');
            background-size: 110% auto; 
            background-repeat: repeat; 
            background-position: center;
            background-attachment: fixed;
        }
        
        .container { 
            background: var(--card-bg); 
            width: 90%; 
            max-width: 380px; 
            height: auto; 
            max-height: 82vh; 
            padding: 20px; 
            border-radius: 30px; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.15); 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
        }
        
        h1 { 
            font-size: 1.5rem; 
            color: var(--accent-color); 
            margin-bottom: 15px; 
            font-family: var(--font-round); 
            text-shadow: 1px 1px 0px #fff; 
        }

        .view { display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .view.active { display: flex; flex-direction: column; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        #menu-view { justify-content: center; gap: 15px; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        
        .category-btn { 
            padding: 18px 10px;
            background: #fff; 
            border: 2px solid var(--primary-color); 
            border-radius: 22px; 
            cursor: pointer; 
            color: var(--accent-color); 
            font-weight: bold; 
            font-size: 1.1rem; 
            font-family: var(--font-round);
            box-shadow: 0 4px 8px rgba(255,192,203,0.15);
            transition: transform 0.2s;
        }
        .category-btn:active { transform: scale(0.95); }
        
        .version-tag { position: absolute; bottom: 10px; right: 18px; font-size: 8px; color: #bbb; }

        .back-btn {
            position: absolute; top: 18px; left: 18px; background: #fff;
            color: var(--accent-color); border: none; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 1.1rem; z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .choice-card { 
            background: #fff; border: 2.5px solid #fff; border-radius: 20px; 
            cursor: pointer; margin-bottom: 12px; overflow: hidden;
            display: flex; flex-direction: column; 
            flex: 1.2;
            min-height: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
        }
        .song-img { width: 100%; flex: 1; object-fit: cover; background: #fafafa; min-height: 0; }
        .song-label { font-size: 0.95rem; font-weight: 700; padding: 10px 5px; color: var(--text-main); }

        .progress-bar { width: 100%; height: 6px; background: #eee; border-radius: 10px; margin-bottom: 15px; }
        #progress-fill { width: 0%; height: 100%; background: var(--accent-color); border-radius: 10px; transition: width 0.3s; }
        #round-info { font-size: 0.85rem; color: var(--accent-color); margin-bottom: 6px; font-family: var(--font-round); }

        #capture-area { padding: 15px; border-radius: 22px; border: 3px solid var(--primary-color); margin-bottom: 12px; background: white; }
        .share-header { color: var(--accent-color); font-size: 1.3rem; margin-bottom: 12px; font-family: var(--font-round); }
        .result-item { display: flex; align-items: center; padding: 6px 15px; background: #fff9fa; margin-bottom: 6px; border-radius: 14px; }
        .rank-img { width: 40px; height: 40px; border-radius: 8px; margin-right: 12px; object-fit: cover; }
        .rank-num { font-size: 1.2rem; font-weight: 900; color: var(--accent-color); width: 22px; }

        .btn-group { gap: 10px; }
        .btn { padding: 13px; border-radius: 16px; font-size: 0.95rem; border: none; color: white; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 8px;}
        .btn-share { background: #F472B6; } 
        .btn-download { background: #6EE7B7; }
        .btn-reset { background: #9CA3AF; }
    </style>
</head>
<body>

<div class="container">
    <button id="global-back" class="back-btn" onclick="confirmReset()" style="display: none;">↩</button>
    <h1>Anson Lo Versus</h1>

    <div id="menu-view" class="view active">
        <div class="category-grid">
            <div class="category-btn" onclick="initGame('fast')">⚡ 跳唱歌</div>
            <div class="category-btn" onclick="initGame('slow')">🌙 深情歌</div>
        </div>
        <p style="color: var(--accent-color); font-size: 0.9rem; font-family: var(--font-round);">選擇你的心水神曲</p>
        <div class="version-tag">v1.4.0-clear-bg</div>
    </div>

    <div id="compare-view" class="view">
        <div class="progress-container">
            <p id="round-info"></p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div class="choice-card" onclick="handleChoice(0)">
            <img id="img-a" class="song-img" src="">
            <div id="option-a" class="song-label">載入中...</div>
        </div>
        <div class="choice-card" onclick="handleChoice(1)">
            <img id="img-b" class="song-img" src="">
            <div id="option-b" class="song-label">載入中...</div>
        </div>
    </div>

    <div id="result-view" class="view">
        <div id="capture-area">
            <div class="share-header">Top 5 心水結果</div>
            <div id="top5-list"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-share" onclick="shareToSocial()">📢 分享結果</button>
            <button class="btn btn-download" onclick="downloadImage()">💾 儲存圖片</button>
            <button class="btn btn-reset" onclick="location.reload()">再玩一次</button>
        </div>
    </div>
</div>

<script>
    const songImages = {
        "特別約會儀式": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/1125.jpg?v=1701010621",
        "偷情": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A14__1.jpg?v=1695549124",
        "同居陌生人": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A13__1.jpg?v=1695549262",
        "Mr. Stranger": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-1-1_1.jpg?v=1695549880",
        "Megahit Megamix": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-1-2_1.jpg?v=1695550314",
        "Megahit": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500_1.jpg?v=1695550442",
        "不可愛教主": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-2_1.jpg?v=1695550631",
        "EGO": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/IMG_0439_1.jpg?v=1695550874",
        "神隊友": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/IMG_9822_1.jpg?v=1695551039",
        "角落生物": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-3-1_1.jpg?v=1695551148",
        "Burn Out": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-2-4_1.jpg?v=1695551272",
        "一所懸命": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/500x500-7_1.jpg?v=1695551374",
        "深閨": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/AL_TheHomebodies.jpg?v=1713337402",
        "My Life": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/MyLife.jpg?v=1704852791",
        "Hey Hey OK!": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/HeyHeyOK_5b657f7c-2ff3-4376-80ed-452ad2803d75.jpg?v=1721128550",
        "Heartbreaker": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/gempages_477370228297172218-0414c180-4fbb-4212-9807-45d6710807eb.png?v=1741015997",
        "致我": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/al_tome.jpg?v=1729668242",
        "King Kong": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A11_King-Kong-2_1.jpg?v=1695550208",
        "永順街39號": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A12__39_1.jpg?v=1695549683",
        "MONEY": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A15_MONEY_1.jpg?v=1695548475",
        "Nah": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/A15_1.jpg?v=1695548268",
        "浪漫殺死巨蟹座": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/cover_3000x3000-scaled_4b1a205b-4080-4aed-b631-3a05f2970d94.jpg?v=1694526945",
        "Lemonade": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/gempages_477370228297172218-74a952b7-5bd2-4609-9c56-079afa1cca63.png?v=1754586438",
        "本命": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/19e978e22b24a827cda3e1554222064e.jpg?v=1774409729",
        "我的支持型伴侶": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Rude Boy": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Take That": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "Trippin' Up": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/KINDOM_6dedc92e-5427-4e92-97bc-eeda6a4c1f2c.jpg?v=1774408405",
        "你都有今日": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/The_time_is_always_now_cover_pic.png?v=1748233393",
        "Gimme Gimme": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Gimme_Gimme.jpg",
        "Charisma": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/Charisma.jpg?v=1774409406",
        "ON": "https://cdn.shopify.com/s/files/1/0571/6987/0938/files/ON.jpg"
    };

    const presets = {
        fast: ["一所懸命", "Megahit", "Megahit Megamix", "Mr. Stranger", "King Kong", "MONEY", "Nah", "ON", "Hey Hey OK!", "Heartbreaker", "Lemonade", "Gimme Gimme", "Charisma", "Trippin' Up", "Take That", "Rude Boy", "My Life", "EGO"],
        slow: ["Burn Out", "角落生物", "神隊友", "不可愛教主", "永順街39號", "同居陌生人", "偷情", "浪漫殺死巨蟹座", "特別約會儀式", "致我", "你都有今日", "本命", "我的支持型伴侶", "深閨"]
    };

    let items = [], scores = {}, currentRound = 0;
    const MAX_ROUNDS = 25; 
    let currentA = "", currentB = "";

    function initGame(type) {
        items = [...presets[type]].sort(() => Math.random() - 0.5);
        scores = {}; items.forEach(item => scores[item] = 1000); 
        currentRound = 0;
        document.getElementById('global-back').style.display = 'flex';
        showView('compare-view');
        nextMatch();
    }

    function confirmReset() {
        if (confirm("返回主選單？")) location.reload();
    }

    function nextMatch() {
        currentRound++;
        if (currentRound > MAX_ROUNDS) { 
            document.getElementById('global-back').style.display = 'none';
            showResults(); return; 
        }
        const sorted = [...items].sort((a, b) => scores[b] - scores[a]);
        let pivot = Math.floor(Math.random() * (items.length - 1));
        currentA = sorted[pivot]; currentB = sorted[pivot + 1];
        updateUI();
    }

    function handleChoice(idx) {
        const winner = idx === 0 ? currentA : currentB;
        const loser = idx === 0 ? currentB : currentA;
        scores[winner] += 55;
        scores[loser] -= 35;
        nextMatch();
    }

    function updateUI() {
        document.getElementById('img-a').src = songImages[currentA];
        document.getElementById('img-b').src = songImages[currentB];
        document.getElementById('option-a').textContent = currentA;
        document.getElementById('option-b').textContent = currentB;
        document.getElementById('progress-fill').style.width = (currentRound / MAX_ROUNDS * 100) + '%';
        document.getElementById('round-info').textContent = `心水決戰：Round ${currentRound}/${MAX_ROUNDS}`;
    }

    function showResults() {
        showView('result-view');
        const sorted = [...items].sort((a, b) => scores[b] - scores[a]);
        const top5 = sorted.slice(0, 5);
        document.getElementById('top5-list').innerHTML = top5.map((song, i) => `
            <div class="result-item">
                <div class="rank-num">${i + 1}</div>
                <img class="rank-img" src="${songImages[song]}">
                <div style="font-weight:700; flex:1; text-align:left; color:#555; font-size:0.9rem;">${song}</div>
            </div>
        `).join('');
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function shareToSocial() {
        const canvas = await html2canvas(document.getElementById('capture-area'), { backgroundColor: "#ffffff", useCORS: true, scale: 2 });
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        const file = new File([blob], 'AL_Top5.png', { type: 'image/png' });
        const shareData = {
            title: 'Anson Lo Versus',
            text: `這是我選出的 Anson Lo 心水 Top 5！你也來挑戰看看吧！`,
            files: [file]
        };
        if (navigator.share && navigator.canShare(shareData)) {
            await navigator.share(shareData);
        } else {
            alert("已複製連結，請自行儲存圖片分享！");
            downloadImage();
        }
    }

    function downloadImage() {
        const btn = document.querySelector('.btn-download');
        btn.textContent = "儲存中...";
        html2canvas(document.getElementById('capture-area'), { backgroundColor: "#ffffff", useCORS: true, scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `AnsonLo_Top5.png`;
            link.href = canvas.toDataURL();
            link.click();
            btn.textContent = "💾 儲存圖片";
        });
    }
</script>
</body>
</html>
