<script>
    const presets = {
        fast: ["一所懸命", "Megahit", "Megahit Megamix", "Mr. Stranger", "King Kong", "MONEY", "Nah", "ON", "Hey Hey OK!", "Heartbreaker", "Lemonade", "Gimme Gimme", "Charisma", "Trippin' Up", "Take That", "Rude Boy"],
        slow: ["Burn Out", "角落生物", "神隊友", "EGO", "不可愛教主", "永順街39號", "同居陌生人", "偷情", "浪漫殺死巨蟹座", "特別約會儀式", "致我", "你都有今日", "本命", "我的支持型伴侶"],
        duet: ["神隊友 (合唱版)", "及時行樂"],
        album: ["教主專輯遺珠"]
    };

    let items = [], scores = {}, totalRounds = 0;
    let leftIdx = 0, rightIdx = 1;

    function preset(type) {
        document.getElementById('items-input').value = presets[type].join('\n');
        startComparison();
    }

    function startComparison() {
        const text = document.getElementById('items-input').value.trim();
        items = text.split('\n').map(i => i.trim()).filter(i => i !== "");
        if (items.length < 2) return alert("請至少選擇兩首歌！");
        
        // 洗牌初始順序
        items.sort(() => Math.random() - 0.5);
        
        scores = {}; 
        items.forEach(i => scores[i] = 0);
        
        totalRounds = 0;
        leftIdx = 0;
        rightIdx = 1;
        
        showView('compare-view');
        updateUI();
    }

    function makeChoice(idx) {
        totalRounds++;
        
        // 獲勝者加分
        const winnerIdx = idx === 0 ? leftIdx : rightIdx;
        const loserIdx = idx === 0 ? rightIdx : leftIdx;
        scores[items[winnerIdx]]++;

        // 核心優化：如果左邊贏了，我們繼續讓它跟下一個比；
        // 如果右邊贏了，交換位置，讓贏家留在左邊繼續挑戰。
        if (idx === 1) {
            // 交換位置，讓贏家留在左邊
            let temp = items[leftIdx];
            items[leftIdx] = items[rightIdx];
            items[rightIdx] = temp;
        }

        rightIdx++;

        if (rightIdx < items.length) {
            updateUI();
        } else {
            // 已經比完一輪，第一名已經產生。
            // 為了增加精準度，我們可以選擇結束，或重置右指針再跑一輪。
            showResults();
        }
    }

    function updateUI() {
        document.getElementById('option-a').textContent = items[leftIdx];
        document.getElementById('option-b').textContent = items[rightIdx];
        
        // 進度條改為顯示已進行的回合
        const progress = (rightIdx / items.length) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
        document.getElementById('round-info').textContent = `對決進度：${rightIdx} / ${items.length}`;
    }

    function showResults() {
        showView('result-view');
        // 根據得分排序，如果得分一樣，則保留原本對決勝出的順序
        const sorted = [...items].sort((a, b) => scores[b] - scores[a]);
        const list = document.getElementById('result-list');
        list.innerHTML = sorted.map((item, i) => `
            <div class="result-item">
                <div class="rank">#${i + 1}</div>
                <div class="song-name">${item} ${i===0?'🏆':''}</div>
            </div>
        `).join('');
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
